<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ Lớp học 11A1 - Đổi chỗ tự động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            position: relative;
        }

        h1 {
            color: #000;
            font-size: 26px;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Nút chuyển chỗ góc trái */
        .rotate-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            padding: 8px 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
            z-index: 10;
        }

        .rotate-btn:hover {
            background-color: #1d4ed8;
        }

        .rotate-btn:active {
            transform: scale(0.96);
        }

        /* Khung chứa bảng chính */
        .table-container {
            width: 96vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
        }

        .classroom-table {
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            width: 100%;
            height: 100%;
            table-layout: fixed;
        }

        .classroom-table td {
            border: 1px solid #000;
            text-align: center;
            vertical-align: middle;
            position: relative;
            overflow: hidden;
        }

        /* Lối đi ở giữa 2 dãy */
        .classroom-table td.aisle {
            width: 25px;
            border-top: none;
            border-bottom: none;
            background-color: transparent;
        }

        /* Bố cục từng bàn học sinh */
        .seat-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 100%;
            position: relative;
            padding-bottom: 22px;
        }

        /* Ảnh học sinh ở phía sau */
        .student-img {
            width: 55%;
            height: 55%;
            object-fit: contain;
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* Ảnh cái bàn đè lên thân học sinh */
        .desk-img {
            width: 85%;
            height: auto;
            max-height: 50%;
            object-fit: contain;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Thẻ chọn tên học sinh */
        .student-select {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            font-size: 16px; /* Chữ trong option đã được tăng kích thước */
            font-weight: bold;
            font-family: inherit;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            text-align: center;
            text-align-last: center;
            z-index: 3;
            cursor: pointer;
            border-radius: 3px;
        }

        /* Hàng bàn giáo viên */
        .teacher-row {
            height: 65px !important;
        }

        .teacher-desk {
            font-size: 18px;
            font-weight: bold;
            background-color: rgba(255, 253, 253, 0.5);
            border: 1px solid #000;
        }
        body{
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxJ14BcDVfw1ojDuY0cI9vNX7OSOTSjUZ_-d7SCY96pZoFWVYu3tsrdAg&s=10');
            background-size: cover;
        }
    </style>
</head>
<body>

    <!-- Nút thực hiện đổi chỗ ở góc trái -->
    <button class="rotate-btn" onclick="rotateSeats()">🔄 Chuyển chỗ theo tuần</button>

    <h1>Sơ đồ lớp 11A1</h1>

    <div class="table-container">
        <table class="classroom-table" id="seat-map">
            <!-- JavaScript tự động sinh 6 hàng bàn học + 1 hàng bàn giáo viên -->
        </table>
    </div>

    <script>
        const studentImages = {
            "": "students.png",
            "an": "an-chibi.png",
            "D.Anh": "student.png",
            "thu": "thu-thu.png",
            "dung": "dung-chibi.png"
        };

        const studentList = [
            { key: "B.an", name: "Bình An" },
            { key: "D.anh", name: "Duy Anh" },
            { key: "H.Anh", name: "Hải Anh" },
            { key: "Bach", name: "Bách" },
            { key: "V.Binh", name: "Vũ Bình" },
            { key: "N.Binh", name: "Như Bình" },
            { key: "Bao", name: "Bảo" },
            { key: "H.Duong", name: "Dương" },
            { key: "D.Dung", name: "Dũng" },
            { key: "T.Dat", name: "Đạt" },
            { key: "D.Duc", name: "Đức" },
            { key: "H.Giang", name: "Hương Giang" },
            { key: "T.Giang", name: "Thu Giang" },
            { key: "M.Hung", name: "Hùng" },
            { key: "B.Hieu", name: "Hiếu" },
            { key: "C.Hung", name: "Hưng" },
            { key: "C.Huy", name: "Chu Huy" },
            { key: "B.Huy", name: "Bùi Huy" },
            { key: "Q.Huy", name: "Quang Huy" },
            { key: "V.Huy", name: "Việt Huy" },
            { key: "T.Kiên", name: "Kiên" },
            { key: "T.Lam", name: "Lâm" },
            { key: "N.Liên", name: "Liên" },
            { key: "H.Linh", name: "Hoàng Linh" },
            { key: "M.Linh", name: "Mỹ Linh" },
            { key: "D.Minh", name: "Đức Minh" },
            { key: "N.Minh", name: "Nguyệt Minh" },
            { key: "H.My", name: "My" },
            { key: "M.Ngọc", name: "Ngọc" },
            { key: "T.Nhi", name: "Nhi" },
            { key: "L.Phuong", name: "Lan Phương" },
            { key: "M.Phuong", name:"Minh Phương"},
            { key: "X.Phong", name: "Xuân Phong" },
            { key: "T.Phong", name: "Thanh Phong" },
            { key: "Q.Thai", name: "Quang Thái" },
            { key: "T.Thảo", name: "Trần Thảo" },
            { key: "N.Thao", name: "Nguyễn Thảo" },
            { key: "T.Thao", name: "Thị Thảo" },
            { key: "Toan", name: "Toản" },
            { key: "T.Truc", name: "Trúc" },
            { key: "M.Tuan", name: "Tuấn" },
            { key: "L.Vinh", name: "Lê Vinh" },
            { key: "T.Vinh", name: "Tiêu Vinh" },
        ];

        // Tạo khung bàn học
        function generateClassroom() {
            const table = document.getElementById('seat-map');
            table.innerHTML = "";

            for (let row = 1; row <= 6; row++) {
                const tr = document.createElement('tr');

                for (let col = 1; col <= 9; col++) {
                    const td = document.createElement('td');

                    if (col === 5) {
                        td.className = 'aisle';
                    } else {
                        const seatId = `${row}-${col}`;
                        let optionsHTML = `<option value="">Trống</option>`;
                        studentList.forEach(s => {
                            optionsHTML += `<option value="${s.key}">${s.name}</option>`;
                        });

                        td.innerHTML = `
                            <div class="seat-content">
                                <img src="students.png" class="student-img" id="img-${seatId}">
                                <img src="desk.png" class="desk-img">
                                <select class="student-select" id="select-${seatId}" onchange="changeStudent('${seatId}', this.value)">
                                    ${optionsHTML}
                                </select>
                            </div>
                        `;
                    }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }

            // Hàng Bàn giáo viên
            const bottomTr = document.createElement('tr');
            bottomTr.className = 'teacher-row';
            
            const teacherTd = document.createElement('td');
            teacherTd.colSpan = 4;
            teacherTd.className = 'teacher-desk';
            teacherTd.innerText = 'Bàn giáo viên';
            bottomTr.appendChild(teacherTd);

            const aisleTd = document.createElement('td');
            aisleTd.className = 'aisle';
            bottomTr.appendChild(aisleTd);

            const emptyTd = document.createElement('td');
            emptyTd.colSpan = 4;
            emptyTd.style.border = '1px solid #000';
            bottomTr.appendChild(emptyTd);

            table.appendChild(bottomTr);

            // Nạp lại dữ liệu đã lưu từ trước (nếu có)
            loadSavedLayout();
        }

        // Thay đổi ảnh học sinh & Lưu vào bộ nhớ
        function changeStudent(seatId, studentKey, save = true) {
            const imgElement = document.getElementById('img-' + seatId);
            if (imgElement) {
                imgElement.src = studentImages[studentKey] || "students.png";
            }
            if (save) {
                saveLayout();
            }
        }

        // Lưu trạng thái hiện tại vào LocalStorage
        function saveLayout() {
            const layoutData = {};
            for (let r = 1; r <= 6; r++) {
                for (let c = 1; colIndex(c); c++) {
                    const realCol = getRealCol(c);
                    const seatId = `${r}-${realCol}`;
                    const select = document.getElementById(`select-${seatId}`);
                    if (select) {
                        layoutData[seatId] = select.value;
                    }
                }
            }
            localStorage.setItem('class_11A1_layout', JSON.stringify(layoutData));
        }

        // Tải lại dữ liệu
        function loadSavedLayout() {
            const saved = localStorage.getItem('class_11A1_layout');
            if (!saved) return;

            const layoutData = JSON.parse(saved);
            Object.keys(layoutData).forEach(seatId => {
                const select = document.getElementById(`select-${seatId}`);
                if (select) {
                    select.value = layoutData[seatId];
                    changeStudent(seatId, layoutData[seatId], false);
                }
            });
        }

        // Hỗ trợ quy đổi cột hiển thị (bỏ qua cột 5 - lối đi)
        function getRealCol(index) {
            // index từ 1 đến 8 đại diện cho 8 vị trí ghế trong 1 hàng
            return index <= 4 ? index : index + 1;
        }

        function colIndex(i) {
            return i <= 8;
        }

        // Thuật toán Đổi Chỗ Vòng Tròn theo mũi tên hình vẽ
        function rotateSeats() {
            // Lấy danh sách vị trí theo 1 vòng khép kín dài 12 hàng (Dãy Trái xuống, Dãy Phải lên)
            // Thứ tự các hàng: Dãy Trái (Hàng 1->6), Dãy Phải (Hàng 6->1)
            const currentData = [];

            // 1. Đọc dữ liệu dãy trái từ Hàng 1 xuống Hàng 6
            for (let r = 1; r <= 6; r++) {
                const rowSeats = [];
                for (let c = 1; c <= 4; c++) {
                    const select = document.getElementById(`select-${r}-${c}`);
                    rowSeats.push(select ? select.value : "");
                }
                currentData.push(rowSeats);
            }

            // 2. Đọc dữ liệu dãy phải từ Hàng 6 ngược lên Hàng 1
            for (let r = 6; r >= 1; r--) {
                const rowSeats = [];
                for (let c = 6; c <= 9; c++) {
                    const select = document.getElementById(`select-${r}-${c}`);
                    rowSeats.push(select ? select.value : "");
                }
                currentData.push(rowSeats);
            }

            // 3. Dịch chuyển mảng xoay vòng sang phải 1 bước (Hàng cuối cùng lên đầu)
            const lastRow = currentData.pop();
            currentData.unshift(lastRow);

            // 4. Gán lại giá trị mới sau khi đã dịch chuyển
            let index = 0;

            // Gán lại cho Dãy Trái (Hàng 1 -> 6)
            for (let r = 1; r <= 6; r++) {
                const rowSeats = currentData[index++];
                for (let c = 1; c <= 4; c++) {
                    const seatId = `${r}-${c}`;
                    const select = document.getElementById(`select-${seatId}`);
                    if (select) {
                        select.value = rowSeats[c - 1];
                        changeStudent(seatId, rowSeats[c - 1], false);
                    }
                }
            }

            // Gán lại cho Dãy Phải (Hàng 6 -> 1)
            for (let r = 6; r >= 1; r--) {
                const rowSeats = currentData[index++];
                for (let c = 6; c <= 9; c++) {
                    const seatId = `${r}-${c}`;
                    const select = document.getElementById(`select-${seatId}`);
                    if (select) {
                        select.value = rowSeats[c - 6];
                        changeStudent(seatId, rowSeats[c - 6], false);
                    }
                }
            }

            // Lưu trạng thái mới vào bộ nhớ
            saveLayout();
        }

        generateClassroom();
    </script>
</body>
</html>
